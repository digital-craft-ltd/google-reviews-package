name: CI

on:
  pull_request:
  push:
    branches:
      - main
      - 'codex/**'
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  validate:
    name: Validate (Node ${{ matrix.node }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node:
          - 20
          - 22

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test

      - name: Build
        run: npm run build

      - name: Verify built package output
        run: npm run verify:dist

      - name: Verify package tarball
        run: npm pack --dry-run

      - name: Audit production dependencies
        if: matrix.node == 20
        run: npm audit --omit=dev

  consumer:
    name: Consumer (Node ${{ matrix.node }} / Astro ${{ matrix.astro }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # Explicit pairs, not a cross product. Astro dropped node 20 in 6.1.0, so
        # astro 6 and 7 have no node 20 leg - astro 6.0.x still advertises
        # `^20.19.1` in engines but its CLI rejects node 20 at runtime anyway.
        # Every major in the `astro` peer range must appear here: the range is
        # only as honest as what CI actually builds.
        include:
          - node: 20
            astro: 5
          - node: 22
            astro: 5
          - node: 22
            astro: 6
          - node: 22
            astro: 7

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build package
        run: npm run build

      - name: Build a consumer app against Astro ${{ matrix.astro }}
        run: npm run verify:consumer -- ${{ matrix.astro }}
